name: Interface Evolution Benchmark v0.1

on:
  pull_request:
    paths:
      - 'interface-evolution-benchmark-v0.1.md'
      - 'benchmark/interface_evolution_v0_1.py'
      - 'benchmark/test_interface_evolution_v0_1.py'
      - 'benchmark/results/results-v0.1.json'
      - 'benchmark/results/results-v0.1.md'
      - 'benchmark/negative-result-ledger-v0.1.md'
      - 'benchmark/README.md'
      - '.github/workflows/interface-evolution-benchmark.yml'
  push:
    branches:
      - main
    paths:
      - 'interface-evolution-benchmark-v0.1.md'
      - 'benchmark/interface_evolution_v0_1.py'
      - 'benchmark/test_interface_evolution_v0_1.py'
      - 'benchmark/results/results-v0.1.json'
      - 'benchmark/results/results-v0.1.md'
      - 'benchmark/negative-result-ledger-v0.1.md'
      - 'benchmark/README.md'
      - '.github/workflows/interface-evolution-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s benchmark -p 'test_*.py' -v

      - name: Re-run frozen benchmark
        run: python benchmark/interface_evolution_v0_1.py --seeds 40 --output-dir /tmp/interface-benchmark

      - name: Verify frozen aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          frozen = json.loads(Path('benchmark/results/results-v0.1.json').read_text())
          current = json.loads(Path('/tmp/interface-benchmark/results-v0.1.json').read_text())

          assert frozen['schema_version'] == current['schema_version']
          assert frozen['seeds'] == current['seeds']
          assert frozen['checks'] == current['checks']

          frozen_rows = {(r['scenario'], r['agent']): r for r in frozen['aggregate']}
          current_rows = {(r['scenario'], r['agent']): r for r in current['aggregate']}
          assert frozen_rows.keys() == current_rows.keys()

          for key in frozen_rows:
              expected = frozen_rows[key]
              observed = current_rows[key]
              for field, expected_value in expected.items():
                  observed_value = observed[field]
                  if isinstance(expected_value, float):
                      assert abs(expected_value - observed_value) <= 1e-6, (
                          key, field, expected_value, observed_value
                      )
                  else:
                      assert expected_value == observed_value, (
                          key, field, expected_value, observed_value
                      )
          PY
