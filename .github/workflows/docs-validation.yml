name: Documentation Validation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/validate_markdown.py'
      - '.github/workflows/docs-validation.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'scripts/validate_markdown.py'
      - '.github/workflows/docs-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Markdown links and formatting
        run: python scripts/validate_markdown.py
